name: DB Keepalive

on:
  schedule:
    - cron: '0 12 */5 * *'   # Every 5 days at noon UTC — prevents free-tier Postgres sleep

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install psycopg2
        run: pip install psycopg2-binary python-dotenv

      - name: Ping database
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          python - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT 1")
          conn.close()
          print("DB keepalive ping successful.")
          EOF

      - name: Skip keepalive when DATABASE_URL is not configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; skipping DB keepalive ping."
